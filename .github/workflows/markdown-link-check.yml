# Markdown link check (lychee)
# Canonical standard: docs/common/markdown-link-check-standard.md
# Validates all URLs in markdown files across the repository.
# Accepted HTTP errors do not establish evidence availability.
# Add declared-reference validation under the consumer repository policy.
name: Markdown Link Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  markdown_link_check:
    name: Markdown Link Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Link Checker
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: >-
            --no-progress
            --include-fragments=anchor-only
            --exclude-loopback
            --max-retries 2
            --retry-wait-time 5
            --accept 200..=299,403,429,503
            './**/*.md'
          fail: true
