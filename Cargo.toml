[workspace]
resolver = "2"
members = [
    "crates/f1r3drive",
    "crates/f1r3drive-fs",
    "crates/f1r3drive-rho",
    "crates/f1r3drive-client",
    "crates/f1r3drive-proto",
    "crates/f1r3drive-wallet",
    "crates/f1r3drive-ext",
    "crates/f1r3drive-crypto",
    "crates/libfuse-t-sys",
    "crates/libfuse-t-rs",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["F1R3FLY.io"]
license = "Apache-2.0"
repository = "https://github.com/F1R3FLY-io/f1r3drive-rust"
rust-version = "1.80"

[workspace.dependencies]
# Internal crates
f1r3drive-fs = { path = "crates/f1r3drive-fs" }
f1r3drive-rho = { path = "crates/f1r3drive-rho" }
f1r3drive-client = { path = "crates/f1r3drive-client" }
f1r3drive-proto = { path = "crates/f1r3drive-proto" }
f1r3drive-wallet = { path = "crates/f1r3drive-wallet" }
f1r3drive-ext = { path = "crates/f1r3drive-ext" }
f1r3drive-crypto = { path = "crates/f1r3drive-crypto" }

# Async + runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
async-trait = "0.1"

# gRPC (versions pinned to match f1r3node-rust so wire encoding stays identical)
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"
tower = "0.5"
http = "1.0"
bytes = "1"

# FUSE on macOS goes through libfuse-t via the workspace-local
# `libfuse-t-sys` + `libfuse-t-rs` crates (which drive libfuse-t's
# high-level C API). Fuser is NOT used — fuser speaks the Linux
# `/dev/fuse` kernel protocol which fuse-t doesn't expose. Prerequisite:
# `brew install --cask fuse-t`.
libc = "0.2"

# Serde / logging / error handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# CLI
clap = { version = "4.5", features = ["derive"] }
humantime = "2.3"

# Crypto for deploy signing (match f1r3node-rust pins)
blake2 = "0.10.6"
k256 = { version = "0.13.4", features = ["ecdsa"] }
p256 = "0.13"
hex = "0.4"
rand = "0.9"

# Testing
tempfile = "3.24"
proptest = "1.6"
testcontainers = "0.23"
serial_test = "3.1"

[profile.dev]
debug = true

[profile.release]
lto = "thin"
codegen-units = 1
