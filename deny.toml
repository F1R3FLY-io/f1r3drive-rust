# cargo-deny policy (https://embarkstudios.github.io/cargo-deny/).
#
# Adapted from f1r3node-rust/deny.toml. CI runs `cargo deny check` in the
# cargo-deny job, and the pre-commit hook runs it when cargo-deny is installed.
#
# Each advisory waiver in [advisories].ignore must give a reason and the work
# that removes it. Do not add a waiver without maintainer review.

[graph]
all-features = true
no-default-features = false

[advisories]
db-path = "$CARGO_HOME/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
unmaintained = "all"
unsound = "all"
maximum-db-staleness = "P7D"
ignore = [
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 comes through k256 and p256 0.13 (ecies, f1r3drive-client, f1r3drive-identity). The fix needs crypto-bigint 0.7.6, which needs k256 and p256 0.14, as in f1r3node-rust. Upgrade under BACKLOG-TD-001." },
  { id = "RUSTSEC-2025-0161", reason = "f1r3drive-crypto directly uses unmaintained libsecp256k1 0.7.2. No maintained release exists. Replace it with k256 under BACKLOG-TD-002, as f1r3node-rust did." },
]

[licenses]
confidence-threshold = 0.8
allow = [
  "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-DFS-2016", "Unicode-3.0",
  "CC0-1.0", "CDLA-Permissive-2.0", "Zlib", "MPL-2.0", "BSL-1.0", "OpenSSL", "Unlicense",
]
exceptions = []
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
