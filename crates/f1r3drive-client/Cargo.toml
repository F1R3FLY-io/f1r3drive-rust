[package]
name = "f1r3drive-client"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "gRPC client, deploy signing, and key management for f1r3drive"

[dependencies]
f1r3drive-proto.workspace = true

tokio.workspace = true
tonic.workspace = true
prost.workspace = true
futures.workspace = true
async-trait.workspace = true

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

blake2 = { workspace = true, features = ["std"] }
k256.workspace = true
p256.workspace = true
hex.workspace = true
rand.workspace = true
bytes.workspace = true
# Blake2b256 output is a 32-byte fixed array; typenum is pulled in transitively
# but we don't need to depend on it directly.

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
