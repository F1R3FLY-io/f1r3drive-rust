[package]
name = "f1r3drive-fs"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "FUSE filesystem implementation backed by the f1r3drive-client and f1r3drive-rho crates"

[dependencies]
f1r3drive-client.workspace = true
f1r3drive-rho.workspace = true
f1r3drive-wallet.workspace = true
f1r3drive-identity.workspace = true
f1r3drive-crypto.workspace = true

libc.workspace = true

tokio.workspace = true
async-trait.workspace = true

thiserror.workspace = true
tracing.workspace = true
hex.workspace = true
rand.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
ureq.workspace = true
urlencoding.workspace = true

# The shared `Filesystem` trait + attribute types live in
# `libfuse-t-rs` on every platform; the mount module itself is
# macOS-only (gated inside the crate).
libfuse-t-rs = { path = "../libfuse-t-rs" }

[target.'cfg(target_os = "linux")'.dependencies]
# Linux mount backend: `fuser` speaks the `/dev/fuse` kernel
# protocol. `linux_mount` translates its inode-based callbacks into
# the shared path-based `Filesystem` trait via a monotonic
# `inode ↔ path` registry.
fuser = { version = "0.16", default-features = false }

[dev-dependencies]
tempfile.workspace = true
hex.workspace = true
